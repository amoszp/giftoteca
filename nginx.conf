server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker and the app shell must always be revalidated,
    # otherwise installed copies never see a new release.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Built assets carry a content hash in their filename.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
